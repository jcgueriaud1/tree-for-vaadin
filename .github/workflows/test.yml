name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright 1.56 has no Chromium build for Ubuntu 26.04, which ubuntu-latest now is.
    # Move on with a Playwright upgrade that supports it (see playwright.version in pom.xml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('addon/package-lock.json') }}
      # Add-on browserless and Lit tests, then Playwright tests against the running demo
      - name: Run tests
        run: ./mvnw -B verify
